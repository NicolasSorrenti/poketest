name: Cube Round Robin
on:
  push:
    branches: [feature/cube-round-robin-online, main]
  pull_request:
    paths:
      - 'cube_room_service.js'
      - 'cube_room_client.js'
      - 'cube_room.html'
      - 'cube_round_robin.js'
      - 'classic_online_service.js'
      - 'classic_live.js'
      - 'online.js'
      - 'test_cube_round_robin.js'
      - 'tests/cube_round_robin_browser_smoke.js'
      - 'tests/cube_parallel_browser_smoke.js'
      - '.github/workflows/cube-round-robin.yml'
jobs:
  round-robin:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser and server syntax
        run: node --check cube_room_client.js && node --check cube_room_service.js && node --check classic_online_service.js
      - name: Run round-robin and existing multiplayer regression tests
        run: node test_cube_round_robin.js && node test_cube_room.js && node test_cube_room_http.js

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependency
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify both players can enter and return from Cube PvP
        run: node tests/cube_round_robin_browser_smoke.js && node tests/cube_parallel_browser_smoke.js
