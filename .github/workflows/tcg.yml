name: TCG Gameplay Regression
on:
  push:
    branches: [main]
  pull_request:
jobs:
  gameplay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify historical Pokémon Power privacy and rules
        run: node test_classic_power_fidelity.js
      - name: Validate all TCG engine and card interactions
        run: npm test
