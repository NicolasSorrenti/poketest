name: Base card fidelity
on:
  pull_request:
    paths: ['headless_duel.js', 'attack_effects_core.js', 'classic_attack_extensions.js', 'test_card_fidelity_base_batch01.js', 'test_card_fidelity_base_batch02.js', 'test_card_fidelity_clefairy.js', '.github/workflows/base-card-fidelity.yml']
  push:
    branches: [main]
    paths: ['headless_duel.js', 'attack_effects_core.js', 'classic_attack_extensions.js', 'test_card_fidelity_base_batch01.js', 'test_card_fidelity_base_batch02.js', 'test_card_fidelity_clefairy.js', '.github/workflows/base-card-fidelity.yml']
jobs:
  base-card-fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test_card_fidelity_base_batch01.js
      - run: node test_card_fidelity_base_batch02.js
      - run: node test_card_fidelity_clefairy.js
      - run: node test_classic_complex_attacks.js
