name: Haymaker Basic-only Decks
on:
  pull_request:
    paths:
      - haymaker_decks.js
      - classic_local_service.js
      - test_haymaker_decks.js
      - .github/workflows/haymaker-decks.yml
  push:
    branches:
      - feature/haymaker-all-eras
    paths:
      - haymaker_decks.js
      - classic_local_service.js
      - test_haymaker_decks.js
      - .github/workflows/haymaker-decks.yml
  workflow_dispatch:
jobs:
  haymaker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate deck recipes and local / online match setup
        run: |
          node --check haymaker_decks.js
          node --check classic_local_service.js
          node --check test_haymaker_decks.js
          node test_haymaker_decks.js
      - name: Validate independent preset deck selection in multiplayer
        run: node test_online_deck_matrix.js
