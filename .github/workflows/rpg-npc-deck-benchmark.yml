name: RPG NPC Deck Balance Benchmark

on:
  push:
    branches: [main]
    paths:
      - 'scripts/benchmark-rpg-npc-decks.js'
      - 'tests/rpg_npc_deck_balance.test.js'
      - 'rpg_npc_deck_progression.js'
      - '.github/workflows/rpg-npc-deck-benchmark.yml'
  workflow_dispatch:

jobs:
  npc-deck-balance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate player growth and NPC deck legality
        run: node --test tests/rpg_npc_deck_balance.test.js
      - name: Evaluate Lyla versus three campaign starter decks
        run: |
          node scripts/benchmark-rpg-npc-decks.js --npcs lyla --starters ember_garden,tidal_circuit,mind_and_muscle --stages early,mid,late --pairs 2 --max-turns 75 > lyla-deck-benchmark.json
          node -e 'const x=require("./lyla-deck-benchmark.json"); for(const r of x.totals) console.log("LYLA "+r.stage+": "+r.cpuWins+" wins / "+r.playerWins+" losses / "+r.draws+" draws/timeouts; win rate "+r.npcWinRateDecisive); for(const e of x.errors)console.error(JSON.stringify(e));'
      - name: Upload Lyla deck benchmark
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lyla-deck-benchmark
          path: lyla-deck-benchmark.json
          if-no-files-found: ignore
      - name: Simulate paired headless Classic duels
        run: |
          set +e
          node scripts/benchmark-rpg-npc-decks.js --npcs reina,hana,camila,marina,shiori,yuna --starters ember_garden,tidal_circuit,mind_and_muscle --pairs 4 --max-turns 75 > rpg-npc-deck-benchmark.json
          result=$?
          set -e
          node -e 'const x=require("./rpg-npc-deck-benchmark.json"); for(const row of x.totals) console.log(row.stage+": "+row.cpuWins+" NPC wins, "+row.playerWins+" player wins, "+row.draws+" draws/timeouts; NPC decisive win rate "+row.npcWinRateDecisive); console.log("Match errors:",x.errors.length); for(const error of x.errors)console.error(JSON.stringify(error)); for(const row of x.cases) console.log(row.stage+" "+row.npc+"/"+row.starter+": NPC "+row.cpuWins+"-"+row.playerWins+" ("+row.drawsOrTimeouts+" draw/timeout), "+row.cpuDeckChanges+" altered NPC slots");'
          exit "$result"
      - name: Upload match results and deck diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-npc-deck-benchmark
          path: rpg-npc-deck-benchmark.json
          if-no-files-found: ignore
