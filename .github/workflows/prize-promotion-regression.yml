name: Prize Selection and Promotion Regression
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'headless_duel.js'
      - 'test_prize_format_consistency.js'
      - '.github/workflows/prize-promotion-regression.yml'
jobs:
  prize-promotion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Prize choices and forced Active promotion
        run: node test_prize_format_consistency.js
