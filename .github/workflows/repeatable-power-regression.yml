name: Repeatable Power Regression
on:
  workflow_dispatch:
jobs:
  power-session:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test_repeatable_power_session.js
      - run: node test_classic_power_fidelity.js
