name: Archived CG random events
on:
  workflow_dispatch:
jobs:
  focused-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check parsing and exact one-time CG encounters
        run: |
          node --check rpg.js
          node --check rpg_cg_gallery.js
          node --check rpg_slice_of_life.js
          node --test tests/rpg_archived_random_cgs.test.js tests/rpg_cg_gallery.test.js
