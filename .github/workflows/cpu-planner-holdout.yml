name: CPU Planner Held-out Validation
on:
  workflow_dispatch:
jobs:
  level7-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full-turn CPU planner and RPG promotion regressions
        run: node --test tests/cpu_deep_levels.test.js tests/rpg_cpu_champion.test.js
      - name: Independent 400-match general seed sample
        run: node scripts/benchmark-cpu-advanced.js --level 7 --pairs 25 --max-turns 120 --fixtures 8 --seed 94723
      - name: Independent 144-match RPG deck seed sample
        run: node scripts/benchmark-cpu-rpg-advanced.js --level 7 --pairs 12 --max-turns 110 --seed 83691
