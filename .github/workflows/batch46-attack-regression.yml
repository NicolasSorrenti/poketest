name: Batch 46 Attack Regression
on:
  pull_request:
    paths:
      - 'engine.js'
      - 'cards/**'
      - 'batch46_targets.json'
      - 'test_attack_batch_v046.js'
      - '.github/workflows/batch46-attack-regression.yml'
  push:
    branches: [main]
    paths:
      - 'engine.js'
      - 'cards/**'
      - 'batch46_targets.json'
      - 'test_attack_batch_v046.js'
      - '.github/workflows/batch46-attack-regression.yml'
jobs:
  batch46:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Batch 46 registry keys and attack outcomes
        run: node test_attack_batch_v046.js
