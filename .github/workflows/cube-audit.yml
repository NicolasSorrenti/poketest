name: Cube Balance Audit
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run seeded drafting and real CPU battles
        run: node test_cube_audit.js
      - name: Upload detailed results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cube-balance-audit
          path: artifacts/cube-balance-audit.json
          if-no-files-found: warn
          retention-days: 14
