name: Cube Draft Regression
on:
  workflow_dispatch:
jobs:
  cube:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify drafting, CPU decks, 40-card battles and tournament
        run: npm run test:cube
