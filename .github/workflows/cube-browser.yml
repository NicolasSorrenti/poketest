name: Cube Multiplayer Chromium
on:
  workflow_dispatch:
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify two browser clients
        run: node tests/cube_room_browser_smoke.js
      - name: Check first-party Cube card artwork in solo and multiplayer browsers
        run: node tests/cube_art_browser_smoke.js
      - name: Verify illustrated solo and multiplayer deck building
        run: node tests/cube_deck_builder_browser_smoke.js
      - name: Verify PvP tournament navigation and automatic return
        run: node tests/cube_round_robin_browser_smoke.js
      - name: Verify parallel matches, spectating and tournament progress
        run: node tests/cube_parallel_browser_smoke.js
      - name: Preserve Cube screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cube-multiplayer-screenshots
          path: |
            artifacts/rpg-browser/cube-room-*.png
            artifacts/rpg-browser/cube-deck-builder-*.png
            artifacts/rpg-browser/cube-deck-locked-*.png
          if-no-files-found: ignore
          retention-days: 7
