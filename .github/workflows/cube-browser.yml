name: Cube Multiplayer Chromium
on:
  pull_request:
    paths:
      - 'cube*'
      - 'server.js'
      - 'tests/cube_room_browser_smoke.js'
      - '.github/workflows/cube-browser.yml'
  push:
    branches: [main]
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save --ignore-scripts playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify two browser clients
        run: node tests/cube_room_browser_smoke.js
      - name: Preserve Cube screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cube-multiplayer-screenshots
          path: artifacts/rpg-browser/cube-room-*.png
          if-no-files-found: ignore
          retention-days: 7
