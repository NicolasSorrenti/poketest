name: RPG NPC Targeted Tuning

on:
  workflow_dispatch:

concurrency:
  group: rpg-npc-tuning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate candidate deck legality and preserved source themes
        run: node --test tests/rpg_npc_candidate_balance.test.js
      - name: Check campaign NPC progression regressions
        run: node --test tests/rpg_npc_deck_progression.test.js tests/rpg_npc_deck_balance.test.js tests/rpg_pack_balance.test.js
      - name: Run matched mirrored live-engine duels across three checkpoints
        run: |
          set +e
          node scripts/benchmark-rpg-npc-candidates.js --days 45,60,80 --styles mixed,evolution,toolkit --starters ember_garden,tidal_circuit --npcs reina --seeds 3 --pairs 1 > npc-tuning-candidates.json
          result=$?
          set -e
          node -e 'const x=require("./npc-tuning-candidates.json"); for(const group of x.comparisons){console.log("DAY "+group.day+" "+group.npc+" BASELINE NPC "+group.baselineNpcWins+" player "+group.baselinePlayerWins);for(const v of group.variants)console.log("  "+v.name+": NPC "+v.npcWins+", player "+v.playerWins+", draws "+v.draws+", change "+v.npcWinDelta);}for(const error of x.errors)console.error(JSON.stringify(error));'
          exit "$result"
      - name: Upload reproducible comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-npc-tuning-candidates
          path: npc-tuning-candidates.json
          if-no-files-found: ignore

  story-progression:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Compare calendar versus story tiers using real character CPU profiles
        run: |
          for mode in calendar story; do
            node scripts/benchmark-rpg-npc-candidates.js --days 45,60,80 --styles mixed,evolution,toolkit --starters ember_garden,tidal_circuit --npcs reina,yuna,camila --seeds 4 --pairs 3 --npc-profile character --selection production --npc-tier "$mode" > "npc-profile-$mode.json"
          done
          node - <<'NODE'
          const fs=require('node:fs');
          for(const mode of ['calendar','story']){
            const x=JSON.parse(fs.readFileSync('npc-profile-'+mode+'.json','utf8'));
            if(x.errors.length)throw Error(mode+' duel errors: '+JSON.stringify(x.errors.slice(0,3)));
            for(const r of x.rows.filter(r=>r.variant!=='baseline')){
              if(r.games<100)throw Error('Insufficient mirrored sample for '+mode+'/'+r.npc+'/'+r.day+': '+r.games);
              console.log(JSON.stringify({scenario:mode,day:r.day,npc:r.npc,variant:r.variant,
                games:r.games,npcWins:r.npcWins,playerWins:r.playerWins,draws:r.draws,
                decisiveNpcWinRate:r.npcWinRate,npcCpuLevel:r.npcCpuLevel,npcPersonality:r.npcPersonality,
                uncertainty95:r.uncertainty95}));
            }
          }
          NODE
      - name: Upload player-versus-character matchup data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rpg-character-profile-matchups
          path: npc-profile-*.json
          if-no-files-found: ignore

  rpg-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run complete RPG regression suite
        run: npm run test:rpg
