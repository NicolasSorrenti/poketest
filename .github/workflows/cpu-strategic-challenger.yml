name: Apex Strategic CPU Challenge
on:
  workflow_dispatch:
jobs:
  challenge-mastermind:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rules, hidden information, bounded CPU planning, RPG regression
        run: node --test tests/cpu_deep_levels.test.js tests/rpg_cpu_champion.test.js
      - name: Apex vs Mastermind - initial mirrored general decks
        run: node scripts/benchmark-cpu-advanced.js --level 8 --baseline-level 7 --pairs 2 --max-turns 100 --fixtures 8 --seed 291451
      - name: Apex vs Mastermind - initial tier 3 NPC mirrors
        run: node scripts/benchmark-cpu-rpg-advanced.js --level 8 --baseline-level 7 --pairs 2 --max-turns 100 --seed 491721
