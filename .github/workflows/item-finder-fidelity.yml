name: Item Finder fidelity
on:
  workflow_dispatch:
jobs:
  trainer-fidelity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node test_moo_moo_milk_fidelity.js
      - run: node test_super_rod_fidelity.js
      - run: node test_old_rod_fidelity.js
      - run: node test_item_finder_paid_trainer.js
      - run: node test_classic_trainer_power_migration.js
