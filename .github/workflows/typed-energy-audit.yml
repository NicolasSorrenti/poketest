name: Typed Energy Attack Audit
on:
  workflow_dispatch:
jobs:
  typed-costs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify printed typed payments and transactional rejection
        run: node test_typed_energy_discard_audit.js
      - name: Check previously dropped mid-sentence Energy type icons
        run: node test_typed_energy_missing_icons.js
      - name: Check every historical Flamethrower printing
        run: node test_flamethrower_typed_discard.js
      - name: Regression for Neo conditional Energy scripts
        run: node test_neo_batch_v048.js
      - name: Verify Poliwrath Water Gun and Whirlpool fidelity
        run: node test_card_fidelity_poliwrath.js
