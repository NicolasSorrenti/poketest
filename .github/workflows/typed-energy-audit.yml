name: Typed Energy Attack Audit
on:
  push:
    branches: [main]
    paths:
      - 'cards/**'
      - 'headless_duel.js'
      - 'attack_effects_core.js'
      - 'neo_attack_batch_v048.js'
      - 'neo_attack_batch_v092.js'
      - 'test_typed_energy_discard_audit.js'
      - '.github/workflows/typed-energy-audit.yml'
  pull_request:
    paths:
      - 'cards/**'
      - 'headless_duel.js'
      - 'attack_effects_core.js'
      - 'neo_attack_batch_v048.js'
      - 'neo_attack_batch_v092.js'
      - 'test_typed_energy_discard_audit.js'
      - '.github/workflows/typed-energy-audit.yml'
jobs:
  typed-costs:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify printed typed payments and transactional rejection
        run: node test_typed_energy_discard_audit.js
      - name: Check every historical Flamethrower printing
        run: node test_flamethrower_typed_discard.js
      - name: Regression for Neo conditional Energy scripts
        run: node test_neo_batch_v048.js
