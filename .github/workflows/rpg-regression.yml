name: RPG Regression Suite

on:
  pull_request:
    paths:
      - 'rpg*.js'
      - 'rpg.html'
      - 'rpg.css'
      - 'tests/rpg_*.test.js'
      - 'package.json'
      - 'characters/**'
      - 'scripts/rpg-character-packs.js'
      - 'CHARACTER_PACKS.md'
      - '.github/workflows/rpg-regression.yml'
  push:
    branches: [main]
    paths:
      - 'rpg*.js'
      - 'rpg.html'
      - 'rpg.css'
      - 'tests/rpg_*.test.js'
      - 'package.json'
      - 'characters/**'
      - 'scripts/rpg-character-packs.js'
      - 'CHARACTER_PACKS.md'
      - '.github/workflows/rpg-regression.yml'

jobs:
  mandatory-system:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify mandatory scheduler and generated character registry
        run: |
          node --test tests/rpg_mandatory_events.test.js
          npm run characters:check
  node-rpg:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate RPG story, schedules, world and duel integration
        run: npm run test:rpg
      - name: Verify cloud save import, conflicts and offline fallback
        run: node --test tests/rpg_cloud_save.test.js
