name: Node regression
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/rpg_story.test.js tests/rpg_integration.test.js tests/rpg_flow.test.js
      - run: npm test
