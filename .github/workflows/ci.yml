name: Quick game checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/rpg-assets/
            !/assets/
            !/*.png
            !/*.jpg
            /cards/
            /tests/
            /scripts/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: RPG, duel and Cube smoke checks
        run: npm test
