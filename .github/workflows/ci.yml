name: Node regression
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser and RPG entrypoints
        run: |
          node --check duel_playmats.js
          node --check classic_live.js
          node --check online.js
          node --check duel_action_rail.js
          node --check rpg.js
          node --check rpg_match_reactions.js
          node --check rpg_match_chat.js
      - name: Three retained game smoke checks
        run: npm test
