name: Node regression
on:
  push:
    branches: [main]
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate match playmats and RPG dialogue transcript
        run: |
          node --check duel_playmats.js
          node --check classic_live.js
          node --check duel_action_rail.js
          node test_duel_action_rail.js
          node --check rpg.js
          node --check rpg_match_reactions.js
          node --check rpg_match_chat.js
          node tests/duel_playmats.test.js
          node tests/rpg_match_chat.test.js
          node --test tests/public_client_scripts.test.js
      - run: node --test tests/rpg_story.test.js tests/rpg_integration.test.js tests/rpg_flow.test.js tests/rpg_save_lock.test.js tests/rpg_art_install.test.js
      - run: npm test
