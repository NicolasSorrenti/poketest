name: Cube Printings and Kanto Origins
on:
  workflow_dispatch:
jobs:
  printings:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify historical set selection and reprint consistency
        run: node --check cube_printings.js && node test_cube_printings.js && node test_cube_presets.js && node test_cube_http.js
