name: RPG CPU Profile Audit

on:
  pull_request:
    paths:
      - 'cpu_profiles.js'
      - 'tests/rpg_cpu_profiles.test.js'
      - '.github/workflows/rpg-cpu-profile-audit.yml'
  push:
    branches: [main]
    paths:
      - 'cpu_profiles.js'
      - 'tests/rpg_cpu_profiles.test.js'
      - '.github/workflows/rpg-cpu-profile-audit.yml'

jobs:
  profiles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/rpg_cpu_profiles.test.js
