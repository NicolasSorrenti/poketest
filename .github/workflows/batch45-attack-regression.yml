name: Batch 45 Attack Regression
on:
  workflow_dispatch:
jobs:
  batch45:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify all Batch 45 registry keys and attack outcomes
        run: node test_attack_batch_v045.js
