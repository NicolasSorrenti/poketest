name: CPU AI regression
on:
  push:
    branches:
      - 'agent/cpu-ai-*'
  pull_request:
    paths:
      - 'cpu_policy.js'
      - 'classic_bot.js'
      - 'classic_local_service.js'
      - 'test_cpu_policy.js'
      - 'benchmark_cpu.js'
      - '.github/workflows/cpu-ai.yml'
jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check cpu_policy.js
      - run: node test_cpu_policy.js
      - run: node test_classic_live_service.js
      - run: node benchmark_cpu.js --pairs 50 --max-turns 60 --left-level 5 --right-level 1
      - run: node benchmark_cpu.js --pairs 25 --max-turns 60 --left-level 5 --right-level 1 --left-deck brushfire --right-deck blackout
      - run: node benchmark_cpu.js --pairs 25 --max-turns 60 --left-level 5 --right-level 4
      - run: node benchmark_cpu.js --pairs 25 --max-turns 60 --left-level 4 --right-level 3
      - run: node benchmark_cpu.js --pairs 25 --max-turns 60 --left-level 3 --right-level 2
      - run: node benchmark_cpu.js --pairs 25 --max-turns 60 --left-level 2 --right-level 1
      - run: node benchmark_cpu.js --pairs 25 --max-turns 120 --left-level 5 --right-level 4
      - run: node benchmark_cpu.js --pairs 25 --max-turns 120 --left-level 2 --right-level 1
      - run: node benchmark_cpu.js --pairs 40 --max-turns 120 --left-level 5 --right-level 5 --left-planning true --right-planning false
      - run: node benchmark_cpu.js --pairs 20 --max-turns 120 --left-level 5 --right-level 5 --left-planning true --right-planning false --left-deck brushfire --right-deck brushfire
      - run: node benchmark_cpu.js --pairs 40 --max-turns 120 --left-level 5 --right-level 5 --left-evolution-tempo true --right-evolution-tempo false
      - run: node benchmark_cpu.js --pairs 30 --max-turns 120 --left-level 5 --right-level 5 --left-evolution-tempo true --right-evolution-tempo false --left-deck brushfire --right-deck brushfire
      - run: node benchmark_cpu.js --pairs 40 --max-turns 120 --left-level 5 --right-level 5 --left-prize-race true --right-prize-race false
      - run: node benchmark_cpu.js --pairs 30 --max-turns 120 --left-level 5 --right-level 5 --left-prize-race true --right-prize-race false --left-deck brushfire --right-deck brushfire
      - run: node benchmark_cpu.js --pairs 30 --max-turns 120 --seed 17891 --left-level 5 --right-level 5 --left-prize-race true --right-prize-race false --left-deck overgrowth --right-deck overgrowth
      - run: node benchmark_cpu.js --pairs 30 --max-turns 120 --seed 27891 --left-level 5 --right-level 5 --left-prize-race true --right-prize-race false --left-deck zap --right-deck zap
      - run: node benchmark_cpu.js --pairs 40 --max-turns 120 --seed 84531 --left-level 5 --right-level 5 --left-knockout-tempo true --right-knockout-tempo false
      - run: node benchmark_cpu.js --pairs 30 --max-turns 120 --seed 94531 --left-level 5 --right-level 5 --left-knockout-tempo true --right-knockout-tempo false --left-deck brushfire --right-deck brushfire
      - run: node benchmark_cpu_tiers.js --pairs 40 --max-turns 120 --seed 71839 --decks blackout,brushfire
      - run: node benchmark_cpu.js --pairs 40 --max-turns 120 --seed 45401 --left-level 5 --right-level 5 --left-opponent-response true --right-opponent-response false
      - run: node benchmark_cpu.js --pairs 30 --max-turns 120 --seed 55401 --left-level 5 --right-level 5 --left-opponent-response true --right-opponent-response false --left-deck brushfire --right-deck brushfire
