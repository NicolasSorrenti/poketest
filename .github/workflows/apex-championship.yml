name: Apex Championship
on:
  workflow_dispatch:
jobs:
  validation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/apex_championship.test.js
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        challenger: [conservative, direct, tempo, mastermind]
        group: [aggression, evolution, control, neo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/apex-championship.js --challenger ${{ matrix.challenger }} --group ${{ matrix.group }} --pairs 2 --max-turns 100 --seed 20261025
