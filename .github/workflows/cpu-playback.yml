name: CPU Playback Regression
on:
  push:
    branches: [main]
    paths:
      - 'battle_presentation_ui.js'
      - 'classic_local_service.js'
      - 'classic_live.js'
      - 'classic_live.html'
      - 'test_battle_presentation_v036.js'
      - 'test_classic_live_service.js'
      - '.github/workflows/cpu-playback.yml'
  pull_request:
    paths:
      - 'battle_presentation_ui.js'
      - 'classic_local_service.js'
      - 'classic_live.js'
      - 'classic_live.html'
      - 'test_battle_presentation_v036.js'
      - 'test_classic_live_service.js'
      - '.github/workflows/cpu-playback.yml'
jobs:
  playback:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: CPU HP playback and same-revision animation
        run: node test_battle_presentation_v036.js
      - name: Server-authoritative CPU action snapshots
        run: node test_classic_live_service.js
