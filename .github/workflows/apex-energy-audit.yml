name: Apex Energy Decision Audit
on:
  pull_request:
    paths:
      - 'cpu_policy.js'
      - 'cpu_lookahead.js'
      - 'cpu_strategic_search.js'
      - 'cpu_decision_audit.js'
      - 'benchmark_cpu.js'
      - 'tests/cpu_decision_audit.test.js'
      - 'tests/cpu_apex_confusion_ko_tempo.test.js'
      - 'tests/cpu_apex_energy_sequence.test.js'
      - 'tests/cpu_apex_computer_search_energy.test.js'
      - 'tests/cpu_apex_rain_dance.test.js'
      - 'tests/cpu_apex_public_bench_projection.test.js'
      - 'tests/cpu_apex_wigglytuff_wave.test.js'
      - '.github/workflows/apex-energy-audit.yml'
  push:
    branches:
      - main
    paths:
      - 'cpu_policy.js'
      - 'cpu_lookahead.js'
      - 'cpu_strategic_search.js'
      - 'cpu_decision_audit.js'
      - 'benchmark_cpu.js'
      - 'tests/cpu_decision_audit.test.js'
      - 'tests/cpu_apex_confusion_ko_tempo.test.js'
      - 'tests/cpu_apex_energy_sequence.test.js'
      - 'tests/cpu_apex_computer_search_energy.test.js'
      - 'tests/cpu_apex_rain_dance.test.js'
      - 'tests/cpu_apex_public_bench_projection.test.js'
      - 'tests/cpu_apex_wigglytuff_wave.test.js'
      - '.github/workflows/apex-energy-audit.yml'
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/cpu_decision_audit.test.js tests/cpu_apex_confusion_ko_tempo.test.js tests/cpu_apex_energy_sequence.test.js tests/cpu_apex_computer_search_energy.test.js tests/cpu_apex_rain_dance.test.js tests/cpu_apex_public_bench_projection.test.js tests/cpu_apex_wigglytuff_wave.test.js
      - run: node benchmark_cpu.js --pairs 1 --max-turns 35 --left-level 8 --right-level 8
