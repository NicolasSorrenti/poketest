name: Apex Energy Decision Audit
on:
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/rpg_cpu_profiles.test.js tests/cpu_decision_audit.test.js tests/cpu_deep_levels.test.js tests/cpu_apex_confusion_ko_tempo.test.js tests/cpu_apex_confused_counterplay.test.js tests/cpu_apex_energy_sequence.test.js tests/cpu_apex_computer_search_energy.test.js tests/cpu_apex_rain_dance.test.js tests/cpu_apex_resource_choices.test.js tests/cpu_pokemon_center_order.test.js tests/apex_turn_audit.test.js tests/cpu_apex_public_bench_projection.test.js tests/cpu_apex_wigglytuff_wave.test.js
      # Verify historical attacks' mixed-Energy discard and damage outcomes.
      - run: node test_attack_batch_v043.js && node test_attack_batch_v043_outcomes.js
      # Exercise real reducer turns, not only the audit function's unit fixtures.
      - run: node scripts/apex-turn-audit.js --deck rain_dance --pairs 1 --max-turns 70
      # Energy Trans changes attachment placement and needs its own real-turn coverage.
      - run: node scripts/apex-turn-audit.js --deck venusaur --pairs 1 --max-turns 70
      - run: node benchmark_cpu.js --pairs 1 --max-turns 35 --left-level 8 --right-level 8
