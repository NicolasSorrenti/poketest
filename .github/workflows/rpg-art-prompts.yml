name: RPG Art Prompt Guard
on:
  workflow_dispatch:
jobs:
  assert-single-scene-prompts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate per-scene art prompts
        run: npm run test:art-prompts
